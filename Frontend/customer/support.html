<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zyka | Customer Support</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Custom CSS (SAME FOLDER) -->
  <link rel="stylesheet" href="support.css">
</head>

<body>

  <main class="support-wrapper">
    <section class="support-card">

      <header class="support-header">
        <h2>Customer Support</h2>
        <p>Submit your concern and our team will take ownership.</p>
      </header>

      <form class="support-form">
        <div class="mb-3">
          <label>Customer Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
          <label>Booking ID</label>
          <input type="text" class="form-control" placeholder="ZYKA-XXXX">
        </div>

        <div class="mb-3">
          <label>Phone Number</label>
          <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX">
        </div>

        <div class="mb-3">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="you@example.com">
        </div>

        <div class="mb-3">
          <label>Your Query</label>
          <textarea class="form-control" rows="4"
            placeholder="Describe your issue or request"></textarea>
        </div>

        <button type="submit" class="btn btn-submit">
          Send to Support
        </button>
      </form>

      <footer class="support-footer">
        © <span id="year"></span> Zyka Support Desk
      </footer>

    </section>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
